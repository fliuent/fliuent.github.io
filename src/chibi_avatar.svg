    <path d="M110,160 Q130,155 135,175 Q140,195 125,200 Q120,180 110,165 Z" />

    <!-- Bang Block Middle-Left -->
    <path d="M125,150 Q160,150 162,185 Q164,210 152,215 Q145,195 125,150 Z" />

    <!-- Center forehead Bang Spike (Classic anime look) -->
    <path d="M155,130 Q192,135 194,202 Q196,218 184,218 Q174,185 155,130 Z" />

    <!-- Center-Right Forehead Bang Spike -->
    <path d="M190,130 Q208,135 210,195 Q212,212 201,212 Q195,185 190,130 Z" />

    <!-- Bang Block Middle-Right -->
    <path d="M232,150 Q238,150 248,185 Q252,205 240,212 Q232,192 232,150 Z" />

    <!-- Bang Block Right -->
    <path d="M280,165 Q265,155 260,175 Q255,195 270,198 Q275,180 280,165 Z" />

    <!-- Top Hair Spikes for dynamic volume -->
    <path d="M185,82 Q200,55 215,82 Z" />
    <path d="M150,92 Q170,68 180,95 Z" />
    <path d="M210,90 Q225,72 235,95 Z" />
  </g>

  <!-- Hair Highlights (soft warm gray) for modern high-quality depth -->
  <path d="M142,105 Q175,88 200,88 Q225,88 245,102 Q215,95 200,95 Q175,95 142,105 Z" fill="#585D63" opacity="0.6" />
  <path d="M155,115 Q175,104 200,104 Q225,104 235,112 M180,120 Q200,113 210,120" fill="none" stroke="#585D63" stroke-width="3" stroke-linecap="round" opacity="0.4" />
</svg>
