<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Circular Cream/Warm Beige Background -->
  <circle cx="200" cy="200" r="195" fill="#FAF5EF" />

  <!-- Chibi Shoulders & Neck -->
  <path d="M170,290 L230,290 L225,320 L175,320 Z" fill="#FADCCA" /> <!-- Neck -->
  <path d="M110,345 Q200,310 290,345 L290,400 L110,400 Z" fill="#FFFFFF" /> <!-- White T-shirt -->

  <!-- Light-Blue Backpack/Overall Straps -->
  <!-- Left Strap -->
  <path d="M140,323 Q152,328 152,360 L152,400 L134,400 L134,360 C134,335 137,326 140,323 Z" fill="#5AA4E7" />
  <!-- Right Strap -->
  <path d="M260,323 Q248,328 248,360 L248,400 L266,400 L266,360 C266,335 263,326 260,323 Z" fill="#5AA4E7" />

  <!-- Shadow below chin on neck -->
