  <!-- Cute Rosy Cheek Blush -->
  <ellipse cx="145" cy="245" rx="15" ry="8" fill="#FFAC9D" opacity="0.6" />
  <ellipse cx="255" cy="245" rx="15" ry="8" fill="#FFAC9D" opacity="0.6" />

  <!-- Anime Eyes -->
  <!-- Left Eye -->
  <g>
    <!-- Lash -->
    <path d="M135,210 Q155,192 175,210" fill="none" stroke="#2B2B2B" stroke-width="5.5" stroke-linecap="round" />
