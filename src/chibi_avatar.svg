    <ellipse cx="155" cy="222" rx="14" ry="17" fill="#422C1A" />
    <ellipse cx="155" cy="222" rx="11" ry="14" fill="#24150A" />
    <!-- Eye Highlights -->
    <circle cx="150" cy="215" r="5" fill="#FFFFFF" />
    <circle cx="160" cy="228" r="2.5" fill="#FFFFFF" />
  </g>
  <!-- Right Eye -->
  <g>
    <!-- Lash -->
    <path d="M225,210 Q245,192 265,210" fill="none" stroke="#2B2B2B" stroke-width="5.5" stroke-linecap="round" />
    <!-- Pupil -->
    <ellipse cx="245" cy="222" rx="14" ry="17" fill="#422C1A" />
    <ellipse cx="245" cy="222" rx="11" ry="14" fill="#24150A" />
    <!-- Eye Highlights -->
    <circle cx="240" cy="215" r="5" fill="#FFFFFF" />
    <circle cx="250" cy="228" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Happy Smile / Little Chibi Mouth -->
  <path d="M192,252 Q200,259 208,252" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" />

  <!-- Cute Nose -->
  <path d="M197,236 Q200,238 203,236" fill="none" stroke="#E8BBA3" stroke-width="2.5" stroke-linecap="round" />

  <!-- Glasses (Black-rimmed round spectacles) -->
  <g>
    <!-- Left Rim -->
    <circle cx="155" cy="220" r="26" fill="none" stroke="#1E1E1E" stroke-width="5" />
    <!-- Right Rim -->
    <circle cx="245" cy="220" r="26" fill="none" stroke="#1E1E1E" stroke-width="5" />
    <!-- Bridge Connection -->
    <path d="M181,220 L219,220" fill="none" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round" />
    <!-- Side stems -->
    <path d="M129,220 L115,213" fill="none" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
    <path d="M271,220 L285,213" fill="none" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  </g>

