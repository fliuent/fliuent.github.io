---
layout: default
---
<article class="post container">
  <header class="post-header">
    <!-- Replace "NA" titles, excerpts, categories, and tags in each Markdown post when adding real content. -->
    <p class="eyebrow">Blog / Notes</p>
    <h1>{{ page.title | default: 'NA' }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    {% if page.categories.size > 0 %}
      <div class="label-row" aria-label="Categories">
        {% for category in page.categories %}
          <span class="label">{{ category }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="content-card post-content">
    {{ content }}
  </div>
</article>
